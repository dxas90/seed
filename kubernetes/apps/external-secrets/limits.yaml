apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-resources
  namespace: external-secrets
spec:
  limits:
    - type: Container
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-resources
  namespace: external-secrets
spec:
  hard:
    limits.cpu: "500m"
    limits.memory: 512Mi
