apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: reloader
spec:
  project: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  sources:
  - repoURL: https://stakater.github.io/stakater-charts
    targetRevision: 2.2.14
    chart: reloader
    helm:
      valueFiles:
      - $values/kubernetes/apps/kube-system/reloader/app/reloader-values.yaml
  - repoURL: git@github.com:dxas90/seed.git
    targetRevision: main
    ref: values
