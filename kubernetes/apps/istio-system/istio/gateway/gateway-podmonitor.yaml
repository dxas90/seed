---
# PodMonitor: scrape istio_requests_total from the Istio ingress gateway
# so KEDA Prometheus triggers can react to live HTTP traffic.
# Metrics exposed on port http-envoy-prom (15090) at /stats/prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-gateway
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: istio-gateway
  namespaceSelector:
    matchNames:
      - istio-system
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
