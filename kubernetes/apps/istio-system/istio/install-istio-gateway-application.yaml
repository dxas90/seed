apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: istio-gateway
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: networking
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    repoURL: https://github.com/dxas90/seed
    targetRevision: main
    path: kubernetes/apps/istio-system/istio/gateway
    directory:
      recurse: true
