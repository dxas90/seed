apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: networking
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  sources:
  - repoURL: https://kubernetes-sigs.github.io/external-dns
    targetRevision: 1.21.1
    chart: external-dns
    helm:
      valueFiles:
      - $values/kubernetes/apps/networking/external-dns/app/external-dns-values.yaml
  - repoURL: https://github.com/dxas90/seed
    targetRevision: main
    ref: values
