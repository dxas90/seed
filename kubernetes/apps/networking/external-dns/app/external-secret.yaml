---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "networking-external-dns-secret"
  namespace: networking
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-ssm-secretsmanager
    kind: ClusterSecretStore
  target:
    name: "external-dns-secret"
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: api-token
      remoteRef:
        key: "/seed/infrastructure/cloudflare/api-token"
