apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/custom-part-of: observability
    app.kubernetes.io/version: 2.9.0
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      valueFiles:
      - $values/kubernetes/apps/observability/tempo/app/tempo-values.yaml
  - repoURL: https://github.com/dxas90/seed
    targetRevision: main
    ref: values
