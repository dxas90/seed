controllers:
  alertmanager:
    annotations:
      reloader.stakater.com/auto: 'true'
    containers:
      alertmanager:
        image:
          repository: quay.io/prometheus/alertmanager
          tag: v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        ports:
        - containerPort: 9093
          name: http
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
        resources:
          limits:
            memory: 99M
          requests:
            cpu: 11m
            memory: 50M
    statefulset:
      volumeClaimTemplates:
      - accessMode: ReadWriteOnce
        globalMounts:
        - path: /alertmanager
        name: storage
        size: 1Gi
    type: statefulset
persistence:
  config:
    globalMounts:
    - path: /etc/alertmanager
    name: alertmanager
    type: configMap
  secrets:
    globalMounts:
    - path: /etc/secrets
    name: alertmanager-secret
    type: secret
route:
  internal:
    hostnames:
    - alerts.example.com
    parentRefs:
    - name: public-gateway
      namespace: istio-system
      sectionName: http
service:
  app:
    ports:
      http:
        port: 9093
