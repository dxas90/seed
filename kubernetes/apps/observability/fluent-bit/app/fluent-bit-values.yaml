image:
  repository: fluent/fluent-bit

fullnameOverride: fluent-bit

testFramework:
  enabled: false

extraVolumes:
  - name: state
    emptyDir: {}

extraVolumeMounts:
  - name: state
    mountPath: /var/fluent-bit/state

serviceAccount:
  create: true
  name: fluent-bit
  annotations: {}

rbac:
  create: true
  nodeAccess: false
  eventsAccess: true

resources:
  limits:
    memory: 500Mi
  requests:
    cpu: 50m
    memory: 150Mi

serviceMonitor:
  enabled: true
  selector:
    release: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s

dashboards:
  enabled: true

priorityClassName: system-node-critical

config:
  service: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Daemon                    off
        Parsers_File              /fluent-bit/etc/parsers.conf
        Parsers_File              /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server               on
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 200M

  inputs: |
    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Exclude_Path        /var/log/containers/fluent-bit*,/var/log/containers/alloy*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit       200MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      On
        storage.type        filesystem

    [INPUT]
        Name                kubernetes_events
        Tag                 kube.events
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_URL            https://kubernetes.default.svc:443

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    [FILTER]
        Name                modify
        Match               kube.*
        Add                 cluster kind-seed

    [FILTER]
        Name                modify
        Match               kube.events
        Add                 cluster kind-seed
        Add                 kubernetes_cluster_events true

  outputs: |
    [OUTPUT]
        Name                loki
        Match               kube.*
        Host                loki.observability.svc.cluster.local
        Port                3100
        URI                 /loki/api/v1/push
        Line_Format         json
        Labels              job=fluent-bit,cluster=$cluster,namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name']
        Auto_Kubernetes_Labels On
        Retry_Limit         False

    [OUTPUT]
        Name                loki
        Match               kube.events
        Host                loki.observability.svc.cluster.local
        Port                3100
        URI                 /loki/api/v1/push
        Line_Format         json
        Labels              job=fluent-bit-events,cluster=$cluster,kubernetes_cluster_events=$kubernetes_cluster_events
        Retry_Limit         False

  customParsers: |
    [PARSER]
        Name                docker_no_time
        Format              json
        Time_Keep           Off
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%L
