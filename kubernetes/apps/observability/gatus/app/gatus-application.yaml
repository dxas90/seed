apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: gatus
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  sources:
  - repoURL: https://twin.github.io/helm-charts
    targetRevision: 1.5.0
    chart: gatus
    helm:
      valueFiles:
      - $values/kubernetes/apps/observability/gatus/app/gatus-values.yaml
  - repoURL: https://github.com/dxas90/seed
    targetRevision: main
    ref: values
