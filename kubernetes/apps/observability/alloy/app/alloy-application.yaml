apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/custom-part-of: observability
    app.kubernetes.io/version: v1.11.3
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 0.12.1
    helm:
      valueFiles:
      - $values/kubernetes/apps/observability/alloy/app/alloy-values.yaml
  - repoURL: https://github.com/dxas90/seed
    targetRevision: main
    ref: values
