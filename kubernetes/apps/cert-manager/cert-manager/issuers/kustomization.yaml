---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./issuers.yaml
# external-secret.yaml pulls the Cloudflare API token from AWS Secrets Manager
# via ClusterSecretStore aws-ssm-secretsmanager. There is no local/kind
# equivalent for a real AWS-backed secret store, so it is excluded here.
# For local testing, Secret/cert-manager-secret is seeded manually instead
# (see docs/argocd-install.md "Local kind testing" / mock secrets section).
# Re-enable this resource when deploying to a real AWS-connected cluster.
