---
kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: seed
  namespace: argocd
spec:
  project: seed-project
  source:
    path: bootstrap
    repoURL: 'https://github.com/dxas90/seed.git'
    targetRevision: refs/heads/main
  destination:
    namespace: argocd
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
