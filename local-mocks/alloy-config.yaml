---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-configmap
  namespace: observability
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }
    
    prometheus.remote_write "default" {
      endpoint {
        url = "http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write"
      }
    }
    
    /*
    Previous Alloy Loki pipeline kept as an easy rollback/reference only.
    Fluent Bit owns pod and Kubernetes event log collection now. Do not enable
    both pipelines unless duplicate Loki ingestion is desired.
    
    discovery.kubernetes "pod" {
      role = "pod"
    }
    
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod.targets
    
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        action        = "replace"
        target_label  = "node"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "replace"
        target_label  = "app"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "job"
        separator     = "/"
        replacement   = "$1"
      }
    }
    
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }
    
    loki.process "pod_logs" {
      stage.static_labels {
        values = {
          cluster = "kind-seed",
        }
      }
    
      forward_to = [loki.write.default.receiver]
    }
    
    loki.source.kubernetes_events "cluster_events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      forward_to = [loki.process.cluster_events.receiver]
    }
    
    loki.process "cluster_events" {
      stage.static_labels {
        values = {
          cluster = "kind-seed",
        }
      }
    
      stage.labels {
        values = {
          kubernetes_cluster_events = "job",
        }
      }
    
      forward_to = [loki.write.default.receiver]
    }
    
    loki.write "default" {
      endpoint {
        url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
    */
