---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-configmap
  namespace: observability
data:
  config.alloy: |
    // Alloy local config - minimal for kind testing
    logging {
      level  = "info"
      format = "logfmt"
    }
    prometheus.remote_write "default" {
      endpoint {
        url = "http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write"
      }
    }
